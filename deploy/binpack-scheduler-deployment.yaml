apiVersion: apps/v1
kind: Deployment
metadata:
  name: binpack-scheduler-eks
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: binpack-scheduler-eks
      app.kubernetes.io/instance: binpack-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: binpack-scheduler-eks
        app.kubernetes.io/instance: binpack-scheduler
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: karpenter.sh/nodepool
                operator: DoesNotExist
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: binpack-scheduler-eks
            topologyKey: kubernetes.io/hostname
      serviceAccountName: binpack-scheduler-eks
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: binpack-scheduler-eks
          command:
          - /app/binpack-scheduler
          args:
          - "--bind-address=0.0.0.0"
          - --config=/etc/kubernetes/custom-k8s-scheduler/binpack-scheduler-config.yaml
          - --v=5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          # 部署前替换为通过本项目 Dockerfile 构建并推送的镜像地址。
          image: <registory id>/binpack-scheduler:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 10259
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
          resources:
            {}
          volumeMounts:
            - mountPath: /etc/kubernetes/custom-k8s-scheduler
              name: config-volume
              readOnly: true
      volumes:
        - configMap:
            name: binpack-scheduler-config
            items:
              - key: binpack-scheduler-config.yaml
                path: binpack-scheduler-config.yaml
          name: config-volume
